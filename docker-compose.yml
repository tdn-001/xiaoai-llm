services:
  xiaoai-llm:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 境外用户默认
        CN_MIRROR: "0"
        PIP_INDEX_URL: https://pypi.org/simple
    image: xiaoai-llm:latest
    container_name: xiaoai-llm
    restart: unless-stopped
    ports:
      - "33003:33003"
    volumes:
      - ./data:/app/data
    environment:
      - XIAOAI_CONFIG=/app/data/config.json
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:33003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # 若音箱无法通过网桥地址拉取 EdgeTTS 音频，可改用 host 网络：
    # network_mode: host